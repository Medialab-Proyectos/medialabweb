name: Experience Radar (manual)

# Actualización AUTOMÁTICA desactivada a propósito: el contenido se actualiza a mano
# (investigación profunda con verificación de fuentes), no por cron. Se conserva solo
# el disparo manual por si alguna vez se quiere golpear el endpoint desde GitHub.
on:
  workflow_dispatch: {}    # solo manual (Actions → Run workflow)

# Evita corridas solapadas si alguna se atrasa.
concurrency:
  group: experience-radar-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Experience Radar daily agent
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/radar.json -w "%{http_code}" \
            -X POST "https://medialab.design/api/experience-radar/run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120)
          echo "HTTP ${code}"
          cat /tmp/radar.json || true
          echo ""
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::El endpoint respondió HTTP ${code}"
            exit 1
          fi
