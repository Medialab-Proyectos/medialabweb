<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="magentaGlow" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic/Glow Button Gradient -->
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172c" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="buttonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Laser Line Gradients -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="buttonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- 2. Ambient Lighting (Glow Orbs) -->
  <circle cx="360" cy="240" r="400" fill="url(#cyanGlow)" />
  <circle cx="840" cy="360" r="450" fill="url(#magentaGlow)" />
  <circle cx="600" cy="300" r="300" fill="url(#orangeGlow)" />

  <!-- 3. Technical Grid Overlay -->
  <g opacity="0.07">
    <!-- Vertical Lines -->
    <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600 M 800,0 L 800,600 M 900,0 L 900,600 M 1000,0 L 1000,600 M 1100,0 L 1100,600" stroke="#ffffff" stroke-width="1" />
    <!-- Horizontal Lines -->
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- 4. Futuristic Tech Patterns & Circuit Paths -->
  <g opacity="0.25">
    <path d="M 150,150 L 300,150 L 380,230 L 500,230" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="150" cy="150" r="4" fill="#06b6d4" />
    <circle cx="500" cy="230" r="3" fill="#06b6d4" />

    <path d="M 1050,450 L 900,450 L 820,370 L 700,370" fill="none" stroke="#d946ef" stroke-width="1.5" />
    <circle cx="1050" cy="450" r="4" fill="#d946ef" />
    <circle cx="700" cy="370" r="3" fill="#d946ef" />
    
    <path d="M 200,450 L 350,450 L 450,350 L 520,350" fill="none" stroke="#f97316" stroke-width="1.5" />
    <circle cx="200" cy="450" r="4" fill="#f97316" />
  </g>

  <!-- 5. Main Tech Constellation / Connection Network -->
  <g stroke="url(#lineGrad1)" stroke-width="2" fill="none">
    <path d="M 100,250 Q 300,120 600,300 T 1100,350" />
    <path d="M 150,380 T 450,220 T 750,380" opacity="0.4" stroke-dasharray="8 8" />
  </g>

  <!-- Glowing Nodes on the network -->
  <g>
    <circle cx="300" cy="180" r="5" fill="#22d3ee" filter="url(#neonCyan)" />
    <circle cx="450" cy="220" r="3" fill="#ffffff" />
    <circle cx="750" cy="380" r="6" fill="#d946ef" filter="url(#neonMagenta)" />
    <circle cx="900" cy="320" r="4" fill="#f97316" />
  </g>

  <!-- 6. Concentric Target/Radar Rings (Central Hub) -->
  <g transform="translate(600, 300)">
    <!-- Outer dashed orbit -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="10 15" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 8" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#d946ef" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="100 120" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.4" />

    <!-- 7. Primary Glowing CTA Button ("Discovery Portal") -->
    <circle cx="0" cy="0" r="70" fill="url(#buttonGrad)" stroke="url(#buttonBorder)" stroke-width="3" filter="url(#buttonGlow)" />
    
    <!-- Pulse Waves expanding out -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="96" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.3" />

    <!-- Compass Icon inside Button -->
    <g transform="scale(1.2)">
      <!-- Outer Compass Ring -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#22d3ee" stroke-width="2" />
      <path d="M 0,-22 L 0,-18 M 0,22 L 0,18 M -22,0 L -18,0 M 22,0 L 18,0" stroke="#22d3ee" stroke-width="2" />
      <!-- Needle -->
      <polygon points="0,-15 5,0 0,3 -5,0" fill="#d946ef" />
      <polygon points="0,15 5,0 0,-3 -5,0" fill="#22d3ee" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>

    <!-- Floating Mini-Badge above -->
    <g transform="translate(0, -96)">
      <rect x="-50" y="-14" width="100" height="26" rx="13" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" />
      <text x="0" y="4" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="2" text-anchor="middle">EXPLORAR</text>
    </g>

    <!-- Glowing click ripple (Expanding circle under cursor) -->
    <g transform="translate(60, 50)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.7" />
      <circle cx="0" cy="0" r="45" fill="none" stroke="#22d3ee" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="60" fill="none" stroke="#22d3ee" stroke-width="0.25" stroke-opacity="0.1" />
    </g>

    <!-- 8. Interactive Cursor (Finger Pointer or Clicker) -->
    <g transform="translate(60, 50)">
      <!-- Cyber Pointer Icon -->
      <!-- Glow under cursor -->
      <circle cx="0" cy="0" r="8" fill="#22d3ee" filter="url(#neonCyan)" opacity="0.8" />
      
      <!-- Hand / Cursor Drawing -->
      <path d="M 0,0 L -12,24 L -4,26 L 2,36 L 6,34 L 0,24 L 8,24 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
      
      <!-- Tiny click sparks -->
      <line x1="-15" y1="-15" x2="-8" y2="-8" stroke="#22d3ee" stroke-width="2" />
      <line x1="0" y1="-20" x2="0" y2="-12" stroke="#22d3ee" stroke-width="2" />
      <line x1="15" y1="-15" x2="8" y2="-8" stroke="#22d3ee" stroke-width="2" />
    </g>
  </g>

  <!-- 9. Floating Sparks & Accent Lights -->
  <g>
    <!-- Sparkles -->
    <path d="M 280,260 L 285,275 L 300,280 L 285,285 L 280,300 L 275,285 L 260,280 L 275,275 Z" fill="#22d3ee" filter="url(#neonCyan)" opacity="0.7" />
    <path d="M 920,180 L 923,190 L 933,193 L 923,196 L 920,206 L 917,196 L 907,193 L 917,190 Z" fill="#d946ef" filter="url(#neonMagenta)" opacity="0.6" />
    
    <!-- Modern Tech Badges on the corners -->
    <text x="80" y="520" fill="#ffffff" fill-opacity="0.3" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="4">METRICSLAB ACADEMY</text>
    <text x="1120" y="520" fill="#ffffff" fill-opacity="0.3" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="4" text-anchor="end">SYS.v2.026</text>
    
    <!-- Prompt Text pointing to action -->
    <text x="600" y="500" fill="#ffffff" fill-opacity="0.6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="5" text-anchor="middle">CLICK PARA INICIAR EL VIAJE</text>
    
    <!-- Floating Hexagons/Tech cubes -->
    <polygon points="180,280 195,270 210,280 210,300 195,310 180,300" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.4" />
    <polygon points="1000,240 1012,232 1024,240 1024,256 1012,264 1000,256" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
</svg>
